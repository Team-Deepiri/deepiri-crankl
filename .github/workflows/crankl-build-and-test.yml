name: Crankl Build and Test

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crankl-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-format:
    name: Auto clang-format
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format

      - name: Apply clang-format
        run: bash scripts/format.sh

      - name: Commit and push if needed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include src tests gui
          git commit -m "style: apply clang-format"
          git push

  style:
    name: Style check (clang-format)
    runs-on: ubuntu-latest
    needs: [auto-format]
    if: always() && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Prefer the PR head ref so a just-pushed format commit is visible.
          ref: ${{ github.head_ref || github.sha }}
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format

      - name: Check clang-format
        run: bash scripts/check_style.sh

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-latest
    needs: [auto-format]
    if: always() && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build build-essential clang-tidy

      - name: Configure (compile_commands.json)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCRANKL_ENABLE_SIMD=OFF

      - name: Run clang-tidy
        run: bash scripts/lint.sh build

  build-and-test:
    name: Release build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build build-essential python3

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Golden parity
        run: bash scripts/verify_parity.sh

      - name: E2E integration
        run: bash scripts/integration_test.sh

  sanitizer:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
