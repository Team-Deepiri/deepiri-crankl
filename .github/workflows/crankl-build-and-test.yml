name: Crankl Build and Test

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crankl-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-format:
    name: Auto clang-format
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format

      - name: Apply clang-format
        run: bash scripts/format.sh

      - name: Commit and push if needed
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include src tests gui
          git commit -m "style: apply clang-format"
          git push

  style:
    name: Style check (clang-format)
    runs-on: ubuntu-latest
    needs: [auto-format]
    if: always() && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Prefer the PR head ref so a just-pushed format commit is visible.
          ref: ${{ github.head_ref || github.sha }}
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format

      - name: Check clang-format
        run: bash scripts/check_style.sh

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-latest
    needs: [auto-format]
    if: always() && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.sha }}
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build build-essential clang-tidy

      - name: Configure (compile_commands.json)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCRANKL_ENABLE_SIMD=OFF

      - name: Run clang-tidy
        run: bash scripts/lint.sh build

  build-and-test:
    name: Release build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build build-essential python3

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Golden parity
        run: bash scripts/verify_parity.sh

      - name: E2E integration
        run: bash scripts/integration_test.sh

  build-macos:
    name: macOS build and test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: brew install cmake ninja python3

      - name: Configure (no AVX2 on arm64)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRANKL_ENABLE_SIMD=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    name: Windows build and test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja mingw-w64-x86_64-cmake mingw-w64-x86_64-python

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizer:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  gui-build:
    name: Qt6 GUI build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev

      - name: Configure
        run: cmake -B build-gui -G Ninja -DCMAKE_BUILD_TYPE=Release -DCRANKL_BUILD_GUI=ON

      - name: Build
        run: cmake --build build-gui --parallel --target crankl-gui

      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-gui/gui/crankl-gui --smoke-test
